<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymTracker">
<meta name="theme-color" content="#0a0a0f">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="manifest" href="/manifest.json">
<title>GymTracker</title>
<style>
:root {
  --bg: #0a0a0f;
  --card: #141420;
  --card-border: #1e1e2e;
  --accent: #6366f1;
  --accent-light: #818cf8;
  --green: #22c55e;
  --green-dim: #166534;
  --orange: #f59e0b;
  --red: #ef4444;
  --text: #e2e8f0;
  --text-dim: #64748b;
  --text-muted: #475569;
  --input-bg: #1a1a2e;
  --nav-bg: #0d0d15;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  padding-bottom: calc(70px + var(--safe-bottom));
}
/* Header */
.header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(10,10,15,0.92);
  backdrop-filter: blur(12px);
  padding: 12px 16px 8px;
  border-bottom: 1px solid var(--card-border);
}
.header h1 { font-size: 1.4rem; font-weight: 700; }
.header .sub { font-size: 0.8rem; color: var(--text-dim); margin-top: 2px; }

/* Bottom Nav */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  background: var(--nav-bg);
  border-top: 1px solid var(--card-border);
  display: flex;
  padding-bottom: var(--safe-bottom);
}
.nav-btn {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 8px 4px;
  background: none; border: none;
  color: var(--text-muted);
  font-size: 0.65rem; font-weight: 600;
  cursor: pointer;
  transition: color 0.2s;
}
.nav-btn.active { color: var(--accent-light); }
.nav-btn svg { width: 24px; height: 24px; margin-bottom: 2px; }

/* Pages */
.page { display: none; padding: 12px 16px 24px; }
.page.active { display: block; }

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
}
.card-title {
  font-size: 1rem; font-weight: 700;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.badge {
  font-size: 0.7rem;
  padding: 3px 8px;
  border-radius: 6px;
  font-weight: 600;
}
.badge-accent { background: var(--accent); color: white; }
.badge-green { background: var(--green-dim); color: var(--green); }
.badge-orange { background: #422006; color: var(--orange); }

/* Exercise Row */
.exercise {
  padding: 12px 0;
  border-bottom: 1px solid var(--card-border);
}
.exercise:last-child { border-bottom: none; }
.ex-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 6px;
}
.ex-name { font-weight: 600; font-size: 0.95rem; flex: 1; }
.ex-prescription { font-size: 0.8rem; color: var(--accent-light); font-weight: 600; }
.ex-notes { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 8px; }
.ex-last {
  font-size: 0.75rem; color: var(--orange); margin-bottom: 8px;
  display: flex; align-items: center; gap: 4px;
}
.ex-last svg { width: 14px; height: 14px; }

/* Set inputs */
.sets-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
  gap: 6px;
}
.set-input {
  display: flex; flex-direction: column; align-items: center;
}
.set-label { font-size: 0.65rem; color: var(--text-muted); margin-bottom: 3px; }
.set-input input {
  width: 100%;
  background: var(--input-bg);
  border: 1px solid var(--card-border);
  border-radius: 8px;
  color: var(--text);
  font-size: 1rem;
  font-weight: 600;
  text-align: center;
  padding: 8px 4px;
  -webkit-appearance: none;
}
.set-input input:focus {
  outline: none;
  border-color: var(--accent);
}
.set-input input.filled {
  border-color: var(--green);
  background: rgba(34,197,94,0.08);
}

/* Category header */
.category-header {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent-light);
  padding: 12px 0 4px;
  border-bottom: 1px solid var(--accent);
  margin-bottom: 0;
}

/* Finisher */
.finisher {
  margin-top: 10px;
  padding: 10px 12px;
  background: rgba(99,102,241,0.08);
  border-radius: 8px;
  font-size: 0.82rem;
  color: var(--accent-light);
}
.finisher strong { color: var(--text); }

/* Day selector */
.day-tabs {
  display: flex; gap: 6px;
  overflow-x: auto;
  padding: 8px 0 12px;
  -webkit-overflow-scrolling: touch;
}
.day-tab {
  flex-shrink: 0;
  padding: 8px 16px;
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  color: var(--text-dim);
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.day-tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

/* Save button */
.save-btn {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  margin-top: 16px;
  transition: background 0.2s;
}
.save-btn:active { background: var(--accent-light); }
.save-btn.saved { background: var(--green); }

/* History */
.history-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid var(--card-border);
  cursor: pointer;
}
.history-date { font-weight: 600; }
.history-day { font-size: 0.85rem; color: var(--text-dim); }
.history-sets { font-size: 0.8rem; color: var(--accent-light); }

/* Settings */
.setting-group { margin-bottom: 20px; }
.setting-label { font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
.setting-hint { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 8px; }
.text-input {
  width: 100%;
  background: var(--input-bg);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  color: var(--text);
  font-size: 0.9rem;
  padding: 12px;
  -webkit-appearance: none;
}
.text-input:focus { outline: none; border-color: var(--accent); }
.text-area {
  min-height: 200px;
  font-family: 'SF Mono', monospace;
  font-size: 0.8rem;
  resize: vertical;
}

/* Action buttons */
.action-btn {
  display: block; width: 100%;
  padding: 14px;
  border: 1px solid var(--card-border);
  border-radius: 12px;
  background: var(--card);
  color: var(--text);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 8px;
  text-align: center;
  transition: all 0.2s;
}
.action-btn:active { background: var(--accent); border-color: var(--accent); }
.action-btn.danger { border-color: var(--red); color: var(--red); }
.action-btn.danger:active { background: var(--red); color: white; }

/* Progress bar */
.progress-bar {
  height: 4px;
  background: var(--card-border);
  border-radius: 2px;
  margin: 8px 0;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.3s;
}

/* Week counter */
.week-info {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0;
}
.week-number { font-size: 1.1rem; font-weight: 700; }
.week-detail { font-size: 0.8rem; color: var(--text-dim); }

/* Toast */
.toast {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  background: var(--green);
  color: white;
  padding: 10px 24px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 0.9rem;
  z-index: 100;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* Modal overlay */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 60;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  padding: 24px 16px calc(16px + var(--safe-bottom));
}
.modal h2 { font-size: 1.1rem; margin-bottom: 16px; }

/* Stats */
.stat-row {
  display: flex; gap: 8px; margin-bottom: 12px;
}
.stat-box {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 12px;
  text-align: center;
}
.stat-value { font-size: 1.4rem; font-weight: 700; color: var(--accent-light); }
.stat-label { font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }
</style>
</head>
<body>

<div class="header">
  <h1 id="headerTitle">GymTracker</h1>
  <div class="sub" id="headerSub">Loading...</div>
</div>

<div class="toast" id="toast"></div>

<!-- TODAY PAGE -->
<div class="page active" id="page-today">
  <div class="week-info">
    <div>
      <div class="week-number" id="weekNumber">Week 1</div>
      <div class="week-detail" id="weekDetail">of 6-week program</div>
    </div>
    <span class="badge badge-accent" id="programBadge">Arms Focus</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="weekProgress"></div></div>

  <div class="day-tabs" id="dayTabs"></div>
  <div id="todayExercises"></div>
  <button class="save-btn" id="saveBtn" onclick="saveWorkout()">Save Workout</button>
</div>

<!-- PROGRAM PAGE -->
<div class="page" id="page-program">
  <div class="stat-row" id="programStats"></div>
  <div id="programOverview"></div>
</div>

<!-- HISTORY PAGE -->
<div class="page" id="page-history">
  <div id="historyList"></div>
</div>

<!-- SETTINGS PAGE -->
<div class="page" id="page-settings">
  <div class="card">
    <div class="card-title">API Key</div>
    <div class="setting-hint">Your Claude API key — stored only on this device.</div>
    <input type="password" class="text-input" id="apiKeyInput" placeholder="sk-ant-api03-...">
    <button class="action-btn" style="margin-top:8px" onclick="saveApiKey()">Save Key</button>
  </div>

  <div class="card">
    <div class="card-title">Generate New Program</div>
    <div class="setting-hint">After 4-6 weeks, generate a new program based on your progress.</div>
    <button class="action-btn" onclick="generatePrompt()">Copy Prompt to Clipboard</button>
    <div class="setting-hint" style="margin-top:8px">Paste the prompt into Claude, then paste the response below:</div>
    <textarea class="text-input text-area" id="newProgramInput" placeholder="Paste Claude's response here..."></textarea>
    <button class="action-btn" style="margin-top:8px" onclick="importProgram()">Import New Program</button>
  </div>

  <div class="card">
    <div class="card-title">Data</div>
    <button class="action-btn" onclick="exportData()">Export All Data</button>
    <button class="action-btn danger" onclick="confirmReset()">Reset Everything</button>
  </div>
</div>

<!-- HISTORY DETAIL MODAL -->
<div class="modal-overlay" id="historyModal">
  <div class="modal">
    <h2 id="modalTitle">Workout Detail</h2>
    <div id="modalContent"></div>
    <button class="action-btn" style="margin-top:16px" onclick="closeModal()">Close</button>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="nav">
  <button class="nav-btn active" data-page="today" onclick="showPage('today')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    Today
  </button>
  <button class="nav-btn" data-page="program" onclick="showPage('program')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>
    Program
  </button>
  <button class="nav-btn" data-page="history" onclick="showPage('history')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"/><path d="M3.05 11a9 9 0 1 1 .5 4"/><path d="M3 16v-5h5"/></svg>
    History
  </button>
  <button class="nav-btn" data-page="settings" onclick="showPage('settings')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    Settings
  </button>
</nav>

<script>
// ============ DEFAULT PROGRAM ============
const DEFAULT_PROGRAM = {
  name: "4-Day Program — Arms Focus",
  startDate: "2026-04-06",
  weeks: 6,
  days: [
    {
      name: "Day 1 — Chest + Triceps",
      subtitle: "Heavy Push",
      exercises: [
        { name: "Smith Machine Chest Press", sets: 4, reps: "6-10", notes: "Heavier — strength focus" },
        { name: "Incline Machine Press", sets: 4, reps: "8-12", notes: "" },
        { name: "Pec Deck Flyes", sets: 3, reps: "12-15", notes: "Squeeze hard at peak" },
        { name: "Low Cable Fly / Crossover", sets: 3, reps: "12-15", notes: "Keep arms slightly bent" },
        { name: "Close-Grip Smith Press", sets: 3, reps: "8-12", notes: "Compound tricep mass builder" },
        { name: "Tricep Pushdowns (bar)", sets: 4, reps: "8-12", notes: "Heavier than before" },
        { name: "Overhead Cable Tricep Extension", sets: 3, reps: "10-15", notes: "Full stretch at bottom" }
      ],
      finisher: "Machine Crunch 3x15 + Pallof Press 3x12/side"
    },
    {
      name: "Day 2 — Back + Biceps",
      subtitle: "Heavy Pull",
      exercises: [
        { name: "Lat Pulldown", sets: 4, reps: "6-10", notes: "Go heavier — strength sets" },
        { name: "Seated Cable Row (wide grip)", sets: 4, reps: "8-12", notes: "Elbows flared slightly" },
        { name: "Machine Row (close grip)", sets: 3, reps: "10-15", notes: "" },
        { name: "Face Pulls", sets: 3, reps: "15", notes: "Shoulder health — don't skip" },
        { name: "EZ Bar / Machine Preacher Curl", sets: 4, reps: "8-10", notes: "Heavy — mass builder" },
        { name: "Incline DB Curl (or Cable Curl)", sets: 3, reps: "10-15", notes: "Stretch focus at bottom" },
        { name: "Cable Hammer Curls (rope)", sets: 3, reps: "12-15", notes: "Brachialis = arm thickness" }
      ],
      finisher: "Machine Crunch 3x15 + Cable Woodchoppers 3x12/side"
    },
    {
      name: "Day 3 — Shoulders",
      subtitle: "All Three Heads",
      exercises: [
        { name: "Seated Shoulder Press Machine", sets: 4, reps: "8-12", notes: "Primary mass builder" },
        { name: "Cable Lateral Raises (single arm)", sets: 4, reps: "12-15", notes: "Slow eccentric — 3 sec down" },
        { name: "Rear Delt Fly Machine", sets: 4, reps: "12-15", notes: "Rear head = rounded shoulder look" },
        { name: "Cable Front Raises", sets: 3, reps: "12-15", notes: "" },
        { name: "Cable Upright Rows", sets: 3, reps: "12-15", notes: "Elbows above wrists, medium grip" }
      ],
      finisher: "Machine Crunch 3x15 + Pallof Press 3x12/side"
    },
    {
      name: "Day 4 — ARMS",
      subtitle: "The Money Session",
      exercises: [
        { name: "Machine / EZ Preacher Curl", sets: 4, reps: "8-10", notes: "Heavy, peak hold 1 sec", category: "BICEPS" },
        { name: "Cable Curl (straight bar)", sets: 3, reps: "10-12", notes: "Constant tension", category: "BICEPS" },
        { name: "Cable Hammer Curls (rope)", sets: 3, reps: "12-15", notes: "Superset with next", category: "BICEPS" },
        { name: "Cable Concentration Curl (single arm)", sets: 3, reps: "12/arm", notes: "Finish the bicep", category: "BICEPS" },
        { name: "Tricep Pushdowns (rope)", sets: 4, reps: "10-15", notes: "Flare rope at bottom", category: "TRICEPS" },
        { name: "Overhead Cable Tricep Extension", sets: 4, reps: "10-15", notes: "Long head = arm size", category: "TRICEPS" },
        { name: "Machine Tricep Dip / Pushdown (bar)", sets: 3, reps: "8-12", notes: "Heavier, compound feel", category: "TRICEPS" }
      ],
      finisher: "Superset finisher (2 rounds): Cable Curl x15 → Pushdown x15 → rest 90s\nAb: Machine Crunch 3x20 + Leg Raises 3x15"
    }
  ]
};

// ============ STATE ============
let state = {
  program: null,
  logs: [],       // { id, date, dayIndex, exercises: [{ name, sets: [{weight,reps}] }] }
  apiKey: '',
  currentDay: 0,
  currentInputs: {} // temp: { "exIdx-setIdx": weight }
};

// ============ STORAGE ============
function loadState() {
  try {
    const saved = localStorage.getItem('gymtracker_state');
    if (saved) {
      const parsed = JSON.parse(saved);
      state.program = parsed.program || DEFAULT_PROGRAM;
      state.logs = parsed.logs || [];
      state.apiKey = parsed.apiKey || '';
    } else {
      state.program = DEFAULT_PROGRAM;
    }
  } catch(e) {
    state.program = DEFAULT_PROGRAM;
  }
}

function saveState() {
  localStorage.setItem('gymtracker_state', JSON.stringify({
    program: state.program,
    logs: state.logs,
    apiKey: state.apiKey
  }));
}

// ============ NAVIGATION ============
function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelector(`.nav-btn[data-page="${page}"]`).classList.add('active');

  if (page === 'today') renderToday();
  if (page === 'program') renderProgram();
  if (page === 'history') renderHistory();
  if (page === 'settings') renderSettings();
}

// ============ TODAY PAGE ============
function renderToday() {
  const p = state.program;
  // Week info
  const start = new Date(p.startDate);
  const now = new Date();
  const diffDays = Math.max(0, Math.floor((now - start) / 86400000));
  const weekNum = Math.min(p.weeks, Math.floor(diffDays / 7) + 1);
  document.getElementById('weekNumber').textContent = `Week ${weekNum}`;
  document.getElementById('weekDetail').textContent = `of ${p.weeks}-week program`;
  document.getElementById('weekProgress').style.width = `${(weekNum / p.weeks) * 100}%`;
  document.getElementById('programBadge').textContent = p.name.split('—')[1]?.trim() || p.name;
  document.getElementById('headerSub').textContent = p.days[state.currentDay].name;

  // Day tabs
  const tabsEl = document.getElementById('dayTabs');
  tabsEl.innerHTML = p.days.map((d, i) => `
    <div class="day-tab ${i === state.currentDay ? 'active' : ''}" onclick="selectDay(${i})">
      ${d.name.replace(/Day \d+ — /, '')}
    </div>
  `).join('');

  // Exercises
  renderExercises();
}

function selectDay(i) {
  state.currentDay = i;
  state.currentInputs = {};
  renderToday();
}

function renderExercises() {
  const day = state.program.days[state.currentDay];
  const container = document.getElementById('todayExercises');
  let html = '<div class="card">';
  if (day.subtitle) {
    html += `<div class="card-title">${day.subtitle}</div>`;
  }

  let currentCategory = null;
  day.exercises.forEach((ex, exIdx) => {
    // Category headers (for Day 4)
    if (ex.category && ex.category !== currentCategory) {
      currentCategory = ex.category;
      html += `<div class="category-header">${currentCategory}</div>`;
    }

    const lastWeights = getLastWeights(ex.name);

    html += `<div class="exercise">`;
    html += `<div class="ex-header">
      <span class="ex-name">${ex.name}</span>
      <span class="ex-prescription">${ex.sets} x ${ex.reps}</span>
    </div>`;

    if (ex.notes) {
      html += `<div class="ex-notes">${ex.notes}</div>`;
    }

    if (lastWeights.length > 0) {
      html += `<div class="ex-last">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"/><path d="M3.05 11a9 9 0 1 1 .5 4"/></svg>
        Last: ${lastWeights.map(w => w + 'kg').join(', ')}
      </div>`;
    }

    // Set inputs
    html += `<div class="sets-grid">`;
    for (let s = 0; s < ex.sets; s++) {
      const key = `${exIdx}-${s}`;
      const val = state.currentInputs[key] || '';
      const prefill = lastWeights[s] || '';
      html += `<div class="set-input">
        <span class="set-label">Set ${s + 1}</span>
        <input type="number" inputmode="decimal" placeholder="${prefill || 'kg'}"
               value="${val}"
               class="${val ? 'filled' : ''}"
               onchange="updateInput('${key}', this.value)"
               onfocus="this.select()">
      </div>`;
    }
    html += `</div></div>`;
  });

  if (day.finisher) {
    html += `<div class="finisher"><strong>Finisher:</strong> ${day.finisher.replace(/\n/g, '<br>')}</div>`;
  }

  html += '</div>';
  container.innerHTML = html;
}

function updateInput(key, value) {
  state.currentInputs[key] = value;
  // Update filled class
  const inputs = document.querySelectorAll('.set-input input');
  inputs.forEach(inp => {
    if (inp.value) inp.classList.add('filled');
    else inp.classList.remove('filled');
  });
}

function getLastWeights(exerciseName) {
  // Search logs from most recent backwards
  for (let i = state.logs.length - 1; i >= 0; i--) {
    const log = state.logs[i];
    const found = log.exercises.find(e => e.name === exerciseName);
    if (found && found.sets.some(s => s.weight > 0)) {
      return found.sets.map(s => s.weight);
    }
  }
  return [];
}

function saveWorkout() {
  const day = state.program.days[state.currentDay];
  const exercises = day.exercises.map((ex, exIdx) => {
    const sets = [];
    for (let s = 0; s < ex.sets; s++) {
      const key = `${exIdx}-${s}`;
      const weight = parseFloat(state.currentInputs[key]) || 0;
      sets.push({ weight, reps: ex.reps });
    }
    return { name: ex.name, sets };
  });

  // Check if any weights were entered
  const hasData = exercises.some(e => e.sets.some(s => s.weight > 0));
  if (!hasData) {
    showToast('Enter at least one weight first');
    return;
  }

  const logEntry = {
    id: Date.now(),
    date: new Date().toISOString().split('T')[0],
    dayIndex: state.currentDay,
    dayName: day.name,
    exercises
  };

  state.logs.push(logEntry);
  saveState();
  state.currentInputs = {};

  const btn = document.getElementById('saveBtn');
  btn.textContent = 'Saved!';
  btn.classList.add('saved');
  setTimeout(() => {
    btn.textContent = 'Save Workout';
    btn.classList.remove('saved');
  }, 2000);

  showToast('Workout saved');
  renderExercises();
}

// ============ PROGRAM PAGE ============
function renderProgram() {
  const p = state.program;
  document.getElementById('headerSub').textContent = p.name;

  // Stats
  const totalExercises = p.days.reduce((sum, d) => sum + d.exercises.length, 0);
  const totalSets = p.days.reduce((sum, d) => sum + d.exercises.reduce((s, e) => s + e.sets, 0), 0);
  const workoutsLogged = state.logs.length;

  document.getElementById('programStats').innerHTML = `
    <div class="stat-box"><div class="stat-value">${p.days.length}</div><div class="stat-label">Days</div></div>
    <div class="stat-box"><div class="stat-value">${totalExercises}</div><div class="stat-label">Exercises</div></div>
    <div class="stat-box"><div class="stat-value">${totalSets}</div><div class="stat-label">Total Sets</div></div>
    <div class="stat-box"><div class="stat-value">${workoutsLogged}</div><div class="stat-label">Logged</div></div>
  `;

  // Overview
  let html = '';
  p.days.forEach((day, i) => {
    html += `<div class="card">
      <div class="card-title">${day.name}
        ${day.subtitle ? `<span class="badge badge-accent">${day.subtitle}</span>` : ''}
      </div>`;

    let currentCategory = null;
    day.exercises.forEach(ex => {
      if (ex.category && ex.category !== currentCategory) {
        currentCategory = ex.category;
        html += `<div class="category-header">${currentCategory}</div>`;
      }
      html += `<div class="exercise">
        <div class="ex-header">
          <span class="ex-name">${ex.name}</span>
          <span class="ex-prescription">${ex.sets} x ${ex.reps}</span>
        </div>
        ${ex.notes ? `<div class="ex-notes">${ex.notes}</div>` : ''}
      </div>`;
    });

    if (day.finisher) {
      html += `<div class="finisher"><strong>Finisher:</strong> ${day.finisher.replace(/\n/g, '<br>')}</div>`;
    }
    html += '</div>';
  });

  document.getElementById('programOverview').innerHTML = html;
}

// ============ HISTORY PAGE ============
function renderHistory() {
  document.getElementById('headerSub').textContent = `${state.logs.length} workouts logged`;

  if (state.logs.length === 0) {
    document.getElementById('historyList').innerHTML = `
      <div class="card" style="text-align:center;color:var(--text-dim);padding:40px">
        No workouts logged yet.<br>Complete a workout on the Today tab to see it here.
      </div>`;
    return;
  }

  let html = '<div class="card">';
  // Show most recent first
  [...state.logs].reverse().forEach(log => {
    const filledSets = log.exercises.reduce((sum, e) => sum + e.sets.filter(s => s.weight > 0).length, 0);
    html += `<div class="history-item" onclick="showLogDetail(${log.id})">
      <div>
        <div class="history-date">${formatDate(log.date)}</div>
        <div class="history-day">${log.dayName}</div>
      </div>
      <div class="history-sets">${filledSets} sets logged</div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('historyList').innerHTML = html;
}

function showLogDetail(id) {
  const log = state.logs.find(l => l.id === id);
  if (!log) return;

  document.getElementById('modalTitle').textContent = `${formatDate(log.date)} — ${log.dayName}`;

  let html = '';
  log.exercises.forEach(ex => {
    const hasData = ex.sets.some(s => s.weight > 0);
    if (!hasData) return;
    html += `<div class="exercise">
      <div class="ex-name">${ex.name}</div>
      <div class="sets-grid" style="margin-top:6px">
        ${ex.sets.map((s, i) => s.weight > 0 ?
          `<div class="set-input"><span class="set-label">Set ${i+1}</span>
           <div style="text-align:center;font-weight:700;color:var(--accent-light)">${s.weight}kg</div></div>` : ''
        ).join('')}
      </div>
    </div>`;
  });

  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('historyModal').classList.add('show');
}

function closeModal() {
  document.getElementById('historyModal').classList.remove('show');
}

// ============ SETTINGS ============
function renderSettings() {
  document.getElementById('headerSub').textContent = 'Settings';
  document.getElementById('apiKeyInput').value = state.apiKey ? '••••••••' + state.apiKey.slice(-8) : '';
}

function saveApiKey() {
  const val = document.getElementById('apiKeyInput').value.trim();
  if (val && !val.startsWith('••')) {
    state.apiKey = val;
    saveState();
    showToast('API key saved');
    renderSettings();
  }
}

function generatePrompt() {
  // Build a summary of progress
  let summary = `Here is my completed ${state.program.weeks}-week gym program:\n\n`;
  summary += `Program: ${state.program.name}\n`;
  summary += `Start date: ${state.program.startDate}\n`;
  summary += `Workouts logged: ${state.logs.length}\n\n`;

  // Last weights per exercise
  summary += `## My latest weights per exercise:\n\n`;
  state.program.days.forEach(day => {
    summary += `### ${day.name}\n`;
    day.exercises.forEach(ex => {
      const last = getLastWeights(ex.name);
      if (last.length > 0) {
        summary += `- ${ex.name}: ${last.map(w => w + 'kg').join(', ')}\n`;
      } else {
        summary += `- ${ex.name}: (no data)\n`;
      }
    });
    summary += '\n';
  });

  // Weight progression
  summary += `## Weight progression over time:\n\n`;
  const exerciseHistory = {};
  state.logs.forEach(log => {
    log.exercises.forEach(ex => {
      if (!exerciseHistory[ex.name]) exerciseHistory[ex.name] = [];
      const maxW = Math.max(...ex.sets.map(s => s.weight).filter(w => w > 0), 0);
      if (maxW > 0) exerciseHistory[ex.name].push({ date: log.date, max: maxW });
    });
  });
  Object.entries(exerciseHistory).forEach(([name, entries]) => {
    if (entries.length > 1) {
      const first = entries[0].max;
      const last = entries[entries.length - 1].max;
      const diff = last - first;
      summary += `- ${name}: ${first}kg → ${last}kg (${diff >= 0 ? '+' : ''}${diff}kg)\n`;
    }
  });

  summary += `\n---\n\n`;
  summary += `Based on this progress, please generate my next ${state.program.weeks}-week gym program.\n`;
  summary += `Keep the same format: day name, exercises with sets x reps and notes.\n`;
  summary += `Progress the weights where I've been consistent. Swap exercises that have stalled.\n`;
  summary += `Keep it as a 4-day split. I train at a commercial gym (machines + cables + free weights).\n`;
  summary += `\nPlease output the program in this exact JSON format so I can import it:\n`;
  summary += '```json\n{\n  "name": "Program Name",\n  "startDate": "YYYY-MM-DD",\n  "weeks": 6,\n  "days": [\n    {\n      "name": "Day 1 — ...",\n      "subtitle": "...",\n      "exercises": [\n        { "name": "...", "sets": 4, "reps": "8-12", "notes": "...", "category": "" }\n      ],\n      "finisher": "..."\n    }\n  ]\n}\n```\n';

  navigator.clipboard.writeText(summary).then(() => {
    showToast('Prompt copied — paste into Claude');
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = summary;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Prompt copied — paste into Claude');
  });
}

function importProgram() {
  const raw = document.getElementById('newProgramInput').value.trim();
  if (!raw) { showToast('Paste a program first'); return; }

  try {
    // Try to extract JSON from markdown code block
    let jsonStr = raw;
    const match = raw.match(/```json?\s*([\s\S]*?)```/);
    if (match) jsonStr = match[1];

    const newProg = JSON.parse(jsonStr);

    // Validate structure
    if (!newProg.name || !newProg.days || !Array.isArray(newProg.days)) {
      throw new Error('Invalid format');
    }

    state.program = newProg;
    if (!state.program.startDate) state.program.startDate = new Date().toISOString().split('T')[0];
    if (!state.program.weeks) state.program.weeks = 6;

    saveState();
    showToast('New program imported!');
    document.getElementById('newProgramInput').value = '';
    showPage('today');
  } catch(e) {
    showToast('Could not parse program — check JSON format');
  }
}

function exportData() {
  const data = JSON.stringify({ program: state.program, logs: state.logs }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gymtracker_backup_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Data exported');
}

function confirmReset() {
  if (confirm('Delete ALL data? This cannot be undone.')) {
    if (confirm('Are you really sure? All workout history will be lost.')) {
      localStorage.removeItem('gymtracker_state');
      state = { program: DEFAULT_PROGRAM, logs: [], apiKey: '', currentDay: 0, currentInputs: {} };
      saveState();
      showPage('today');
      showToast('All data reset');
    }
  }
}

// ============ HELPERS ============
function formatDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('en-ZA', { weekday: 'short', day: 'numeric', month: 'short' });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ============ SERVICE WORKER ============
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

// ============ INIT ============
loadState();
showPage('today');
</script>
